<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thời khóa biểu</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--muted:#5b6785;--paper:#f2f5fa;--card:#fff;--line:#dbe2ee;--head:#e8eef9;--accent:#2f5bea;--mark:#ffc933;--markbg:#fff6d6;--tn:#0b7a53;--err:#c0262d;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--ink:#e8edf8;--muted:#97a3c0;--paper:#0e1424;--card:#171f35;--line:#2a3555;--head:#202a47;--accent:#7b9bff;--mark:#ffc933;--markbg:#3a3318;--tn:#4fd6a0;--err:#ff7b80}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
.page{max-width:1080px;margin:0 auto;padding:20px 16px 32px}
header{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{margin:0;font-size:clamp(26px,5vw,38px);line-height:1.1;font-weight:800;letter-spacing:-.02em}
#title{margin:6px 0 0;color:var(--muted);font-size:14px;font-weight:500}
.pick{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
select,input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
select{font-size:22px;font-weight:800;min-width:130px;padding:6px 12px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.today{background:var(--ink);color:var(--paper);border-radius:16px;padding:16px 18px;margin-bottom:22px;display:grid;gap:12px}
.today h2{margin:0;font-size:16px;font-weight:700}
.today h2 span{background:var(--mark);color:#14213d;border-radius:6px;padding:1px 8px;margin-left:6px}
.today .row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.today .lb{font-size:13px;font-weight:600;opacity:.75;min-width:48px}
.chip{background:rgba(255,255,255,.14);border-radius:8px;padding:3px 10px;font-weight:600;font-size:14px}
.chip b{color:var(--mark);margin-right:6px}
@media(prefers-color-scheme:dark){.today{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}}
section{margin-bottom:22px}
section h3{margin:0 0 8px;font-size:18px;font-weight:700;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
section h3 small{font-size:13px;color:var(--muted);font-weight:500}
.wrap{overflow-x:auto;background:var(--card);border:1.5px solid var(--line);border-radius:14px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:720px}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
tr:last-child td{border-bottom:0}th:last-child,td:last-child{border-right:0}
th{background:var(--head);font-size:13px;font-weight:700}
td{font-weight:500;height:46px}
td.p{font-weight:800;color:var(--accent);width:56px;background:var(--head);position:sticky;left:0}
td.t{color:var(--muted);font-size:13px;white-space:nowrap;width:110px}
th.now{background:var(--mark);color:#14213d}
td.now{background:var(--markbg)}
td.tn{color:var(--tn);font-weight:700}
.tools{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:4px 16px;margin-bottom:8px}
.tools summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--muted)}
.tools .bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:6px 0 14px;font-size:14px}
.tools .bar>span,.tools label{font-weight:600}
button{font:inherit;font-weight:700;font-size:15px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#0e1424}}
#note{color:var(--muted);font-size:13px;margin:10px 2px 0}
#msg{color:var(--err);font-weight:600;font-size:14px;margin:6px 2px}
#msg:empty{display:none}
#foot{margin-top:28px;text-align:center;color:var(--muted);font-size:13px}
#foot b{color:var(--ink)}
</style>
</head>
<body>
<div class="page">
<header>
  <div>
    <h1>Thời khóa biểu</h1>
    <p id="title"></p>
  </div>
  <label class="pick">Chọn lớp <select id="cls"></select></label>
</header>
<div id="today"></div>
<div id="out"></div>
<details class="tools">
  <summary>Cập nhật thời khóa biểu</summary>
  <div class="bar">
    <label for="file">Tải file Excel:</label>
    <input type="file" id="file" accept=".xlsx,.xls">
  </div>
  <div class="bar">
    <span>Hoặc lấy từ link:</span>
    <input type="text" id="link" size="40" placeholder="Dán link bài TKB của trường (để trống = tuần mới nhất)">
    <button id="go">Lấy từ link</button>
  </div>
</details>
<div id="msg"></div>
<div id="note"></div>
<div id="foot">Powered by <b>Trần Công</b></div>
</div>
<script>
const DAYS = [2,3,4,5,6,7], NAMES = {2:'Thứ hai',3:'Thứ ba',4:'Thứ tư',5:'Thứ năm',6:'Thứ sáu',7:'Thứ bảy'};
const TIMES = {
  S: ['7h15-8h00','8h05-8h50','9h10-9h55','10h00-10h45',''],
  C: ['13h45-14h30','14h35-15h20','15h35-16h20','16h25-17h10','']
};
const NOTE = {S:'Giải lao 20 phút', C:'Giải lao 15 phút'};
let DB = null;

function parse(wb){
  const db = {classes:[], data:{}, title:''};
  wb.SheetNames.forEach(name=>{
    const n = name.trim().toLowerCase();
    const s = n.startsWith('sáng') ? 'S' : (n.startsWith('chiều') ? 'C' : null);
    if(!s) return;
    const ws = wb.Sheets[name];
    const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    const h = rows.findIndex(r=>String(r[0]).trim()==='Thứ');
    if(h<0) return;
    if(!db.title && ws.A3) db.title = String(ws.A3.v).replace(/\s*\n\s*/g,' - ');
    const cols = [];
    rows[h].forEach((v,c)=>{ if(c>=4 && String(v).trim()) cols.push([c,String(v).trim()]); });
    cols.forEach(([c,cl])=>{
      if(!db.classes.includes(cl)) db.classes.push(cl);
      db.data[cl] = db.data[cl] || {S:{},C:{}};
    });
    let day = null;
    for(let r=h+1;r<rows.length;r++){
      const d = parseInt(rows[r][0]); if(d) day = d;
      const p = parseInt(rows[r][2]);
      if(!day || !p) continue;
      cols.forEach(([c,cl])=>{
        const t = String(rows[r][c]).trim();
        (db.data[cl][s][day] = db.data[cl][s][day] || {})[p] = t;
      });
    }
  });
  return db;
}

const esc = s => s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

const TODAY = new Date().getDay() + 1; // Thứ hai = 2 ... Thứ bảy = 7, Chủ nhật = 1

function table(cl, s){
  const label = s==='S' ? 'Buổi sáng' : 'Buổi chiều';
  let h = `<section><h3>${label} <small>${NOTE[s]}</small></h3><div class="wrap"><table><tr><th>Tiết</th>` +
    DAYS.map(d=>`<th class="${d===TODAY?'now':''}">${NAMES[d]}</th>`).join('') + '<th>Thời gian</th></tr>';
  for(let p=1;p<=5;p++){
    h += `<tr><td class="p">${p}</td>`;
    DAYS.forEach(d=>{
      const t = (DB.data[cl][s][d]||{})[p] || '';
      h += `<td class="${(t.startsWith('TNHN')?'tn ':'')+(d===TODAY?'now':'')}">${esc(t)}</td>`;
    });
    h += `<td class="t">${TIMES[s][p-1]}</td></tr>`;
  }
  return h + '</table></div></section>';
}

function todayBox(cl){
  if(!DAYS.includes(TODAY)) return '<div class="today"><h2>Hôm nay là Chủ nhật — nghỉ học</h2></div>';
  let h = `<div class="today"><h2>Hôm nay<span>${NAMES[TODAY]}</span></h2>`;
  [['S','Sáng'],['C','Chiều']].forEach(([s,lb])=>{
    const day = DB.data[cl][s][TODAY] || {};
    const items = [1,2,3,4,5].filter(p=>day[p]).map(p=>`<span class="chip"><b>${p}</b>${esc(day[p])}</span>`);
    h += `<div class="row"><span class="lb">${lb}</span>${items.join('') || '<span class="lb">Không có tiết</span>'}</div>`;
  });
  return h + '</div>';
}

function render(){
  const cl = document.getElementById('cls').value;
  try{ localStorage.setItem('lop', cl); }catch(e){}
  document.getElementById('title').textContent = 'Lớp ' + cl + (DB.title ? ' — ' + DB.title : '');
  document.getElementById('today').innerHTML = todayBox(cl);
  document.getElementById('out').innerHTML = table(cl,'S') + table(cl,'C');
}

// ---- Lưu file đã chọn vào trình duyệt (IndexedDB) ----
const STORE = 'files', KEY = 'current';
const idb = () => new Promise((ok, no) => {
  const q = indexedDB.open('tkb', 1);
  q.onupgradeneeded = () => q.result.createObjectStore(STORE);
  q.onsuccess = () => ok(q.result);
  q.onerror = () => no(q.error);
});
async function saveFile(buf, label){
  try{
    const d = await idb();
    await new Promise((ok, no) => {
      const t = d.transaction(STORE, 'readwrite');
      t.objectStore(STORE).put({buf, label, time: Date.now()}, KEY);
      t.oncomplete = ok; t.onerror = () => no(t.error);
    });
    showNote(label);
  }catch(e){}
}
async function getSaved(){
  try{
    const d = await idb();
    return await new Promise((ok, no) => {
      const q = d.transaction(STORE).objectStore(STORE).get(KEY);
      q.onsuccess = () => ok(q.result || null);
      q.onerror = () => no(q.error);
    });
  }catch(e){ return null; }
}
function showNote(label){
  document.getElementById('note').textContent = label ? 'Đang dùng: ' + label : '';
}

// ---- Chia sẻ TKB cho mọi người (lưu trên server) ----
function toB64(buf){
  const u = new Uint8Array(buf); let s = '';
  for(let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i,i+0x8000));
  return btoa(s);
}
function fromB64(b){
  const s = atob(b), u = new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) u[i] = s.charCodeAt(i);
  return u.buffer;
}
async function publish(buf, label){
  try{
    const r = await fetch('/api/shared', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({label, b64: toB64(buf)})});
    if(!r.ok){ const j = await r.json().catch(()=>({})); throw new Error(j.error || ('Lỗi ' + r.status)); }
    showNote(label + ' — đã chia sẻ cho mọi người');
  }catch(e){
    document.getElementById('msg').textContent = 'Đã dùng trên máy này nhưng chưa chia sẻ được: ' + e.message;
  }
}
async function getShared(){
  try{
    const r = await fetch('/api/shared', {cache:'no-store'});
    if(r.status !== 200) return null;
    const j = await r.json();
    return j && j.b64 ? j : null;
  }catch(e){ return null; }
}

function load(wb){
  DB = parse(wb);
  const sel = document.getElementById('cls');
  if(!DB.classes.length){ document.getElementById('msg').textContent='Không đọc được dữ liệu. Kiểm tra file có 2 sheet bắt đầu bằng "sáng" và "chiều".'; return false; }
  document.getElementById('msg').textContent='';
  let saved = ''; try{ saved = localStorage.getItem('lop')||''; }catch(e){}
  sel.innerHTML = DB.classes.map(c=>`<option>${c}</option>`).join('');
  if(DB.classes.includes(saved)) sel.value = saved;
  render();
  return true;
}

const stamp = () => new Date().toLocaleString('vi-VN');

document.getElementById('cls').addEventListener('change', render);
document.getElementById('file').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  f.arrayBuffer().then(b=>{
    if(load(XLSX.read(b,{type:'array'}))){ const lb = 'file tải lên "' + f.name + '" (' + stamp() + ')'; saveFile(b, lb); publish(b, lb); }
  });
});
function fromLink(){
  const u = document.getElementById('link').value.trim();
  const msg = document.getElementById('msg');
  msg.textContent = 'Đang tải...';
  fetch('/api/tkb' + (u ? '?url=' + encodeURIComponent(u) : ''))
    .then(r=>{ if(!r.ok) return r.json().then(j=>{ throw new Error(j.error||'Lỗi'); }); return r.arrayBuffer(); })
    .then(b=>{
      if(load(XLSX.read(b,{type:'array'}))){ const lb = (u ? 'file lấy từ link' : 'tuần mới nhất từ trường') + ' (' + stamp() + ')'; saveFile(b, lb); publish(b, lb); }
    })
    .catch(e=>{ msg.textContent = 'Không lấy được từ link: ' + e.message; });
}
document.getElementById('go').addEventListener('click', fromLink);

// Mở trang: có file đã lưu thì dùng luôn; chưa có thì thử lấy tuần mới nhất (không lưu), lỗi thì dùng tkb.xlsx đi kèm
getShared().then(sh=>{
  if(sh && load(XLSX.read(fromB64(sh.b64),{type:'array'}))){ showNote(sh.label + ' — bản chung'); return; }
  return getSaved();
}).then(s=>{
  if(s === undefined) return;
  if(s && s.buf){
    if(load(XLSX.read(s.buf,{type:'array'}))){ showNote(s.label); return; }
  }
  return fetch('/api/tkb').then(r=>{ if(!r.ok) throw 0; return r; })
    .catch(()=>fetch('tkb.xlsx?v='+Date.now()))
    .then(r=>r.arrayBuffer()).then(b=>load(XLSX.read(b,{type:'array'})))
    .catch(()=>{ document.getElementById('msg').textContent='Không tải được thời khóa biểu'; });
});
</script>
</body>
</html>
